<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Writing Workspace &mdash; Ekansh Bhavik</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style/base.css" />
    <link rel="stylesheet" href="/style/themes.css" />
    <link rel="stylesheet" href="/style/layout.css" />
    <link rel="stylesheet" href="/style/components.css" />
    <link rel="stylesheet" href="/style/blog.css" />
    <link rel="stylesheet" href="/style/editor.css" />
  </head>
  <body data-page="admin-editor">
    <!-- Editor Header -->
    <header class="editor-header">
      <div class="editor-header-left">
        <a class="editor-back" href="/admin/" id="back-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M7.78 12.53a.75.75 0 0 1-1.06 0L2.47 8.28a.75.75 0 0 1 0-1.06l4.25-4.25a.749.749 0 1 1 1.06 1.06L4.81 7h7.44a.75.75 0 0 1 0 1.5H4.81l2.97 2.97a.749.749 0 0 1-1.06 1.06Z"/>
          </svg>
          <span>Back</span>
        </a>
        <span id="editor-heading">New Post</span>
        <span class="editor-status editor-status--draft" id="editor-status-badge">DRAFT</span>
        <span class="editor-autosave" id="editor-autosave"></span>
      </div>
      <div class="editor-header-right">
        <button
          type="button"
          class="editor-btn"
          id="editor-preview-toggle"
          aria-label="Toggle preview"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 2c1.981 0 3.671.992 4.933 2.078 1.27 1.091 2.187 2.345 2.637 3.023a1.62 1.62 0 0 1 0 1.798c-.45.678-1.367 1.932-2.637 3.023C11.67 13.008 9.981 14 8 14c-1.981 0-3.671-.992-4.933-2.078C1.797 10.831.88 9.577.43 8.899a1.62 1.62 0 0 1 0-1.798c.45-.678 1.367-1.932 2.637-3.023C4.33 2.992 6.019 2 8 2ZM1.679 7.932a.12.12 0 0 0 0 .136c.411.622 1.241 1.75 2.366 2.717C5.176 11.758 6.527 12.5 8 12.5c1.473 0 2.825-.742 3.955-1.715 1.124-.967 1.954-2.096 2.366-2.717a.12.12 0 0 0 0-.136c-.412-.621-1.242-1.75-2.366-2.717C10.824 4.242 9.473 3.5 8 3.5c-1.473 0-2.824.742-3.955 1.715-1.124.967-1.954 2.096-2.366 2.717ZM8 10a2 2 0 1 1-.001-3.999A2 2 0 0 1 8 10Z"/>
          </svg>
          <span id="editor-preview-text">Preview</span>
        </button>
        <button
          type="button"
          class="editor-btn editor-sidebar-toggle"
          id="editor-sidebar-toggle"
          aria-label="Toggle settings"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0a8.2 8.2 0 0 1 .701.031C9.444.095 9.99.645 10.16 1.29l.288 1.107c.018.066.079.158.212.224.231.114.454.243.668.386.123.082.233.09.299.071l1.1-.303c.652-.18 1.37-.042 1.67.558.43.862.56 1.762.56 2.667 0 .905-.13 1.805-.56 2.667-.3.6-1.018.738-1.67.558l-1.1-.303c-.066-.018-.176-.01-.299.071a4.946 4.946 0 0 1-.668.386c-.133.066-.194.158-.212.224l-.288 1.107c-.17.645-.716 1.195-1.459 1.26a8.006 8.006 0 0 1-1.402 0c-.743-.065-1.289-.615-1.459-1.26l-.288-1.107c-.018-.066-.079-.158-.212-.224a5 5 0 0 1-.668-.386c-.123-.082-.233-.09-.299-.071l-1.1.303c-.652.18-1.37.042-1.67-.558C.16 11.805.03 10.905.03 10c0-.905.13-1.805.56-2.667.3-.6 1.018-.738 1.67-.558l1.1.303c.066.018.176.01.299-.071.214-.143.437-.272.668-.386.133-.066.194-.158.212-.224l.288-1.107C4.01.645 4.556.095 5.299.031 5.514.01 5.731 0 5.95 0H8Zm-.571 1.525c-.036.003-.071.007-.107.011a.612.612 0 0 0-.441.388l-.287 1.106a1.62 1.62 0 0 1-.88 1.008c-.171.084-.334.18-.487.286a1.62 1.62 0 0 1-1.303.235l-1.1-.303a.612.612 0 0 0-.562.154A6.67 6.67 0 0 0 1.826 6.1a.612.612 0 0 0 .12.546l.805.802a1.62 1.62 0 0 1 .42 1.252 4.558 4.558 0 0 0 0 .6 1.62 1.62 0 0 1-.42 1.252l-.805.802a.612.612 0 0 0-.12.546 6.67 6.67 0 0 0 .436 1.49.612.612 0 0 0 .562.154l1.1-.303a1.62 1.62 0 0 1 1.303.235c.153.106.316.202.487.286a1.62 1.62 0 0 1 .88 1.008l.287 1.106a.612.612 0 0 0 .441.388 7 7 0 0 0 1.142 0 .612.612 0 0 0 .441-.388l.288-1.106a1.62 1.62 0 0 1 .88-1.008c.17-.084.333-.18.486-.286a1.62 1.62 0 0 1 1.303-.235l1.1.303a.612.612 0 0 0 .562-.154 6.67 6.67 0 0 0 .436-1.49.612.612 0 0 0-.12-.546l-.805-.802a1.62 1.62 0 0 1-.42-1.252 4.56 4.56 0 0 0 0-.6 1.62 1.62 0 0 1 .42-1.252l.805-.802a.612.612 0 0 0 .12-.546 6.67 6.67 0 0 0-.436-1.49.612.612 0 0 0-.562-.154l-1.1.303a1.62 1.62 0 0 1-1.303-.235 5.006 5.006 0 0 0-.486-.286 1.62 1.62 0 0 1-.88-1.008l-.288-1.106a.612.612 0 0 0-.441-.388 7 7 0 0 0-1.142 0ZM11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm-1.5 0a1.5 1.5 0 1 0-3.001-.001A1.5 1.5 0 0 0 9.5 8Z"/>
          </svg>
        </button>
        <button type="button" class="editor-btn" id="editor-save">Save Draft</button>
        <button type="button" class="editor-btn editor-btn--primary" id="editor-publish">
          <span id="editor-publish-text">Publish</span>
        </button>
      </div>
    </header>

    <!-- Editor Body -->
    <div class="editor-page">
      <div class="editor-body">
        <!-- Writing Canvas -->
        <div class="editor-canvas" id="editor-canvas">
          <div class="editor-canvas-inner">
            <!-- Title -->
            <textarea
              id="editor-title"
              class="editor-title-input"
              placeholder="Post title..."
              rows="1"
              autofocus
            ></textarea>
            <span class="editor-slug-preview" id="editor-slug">/blogs/?post=...</span>

            <!-- Description -->
            <textarea
              id="editor-desc"
              class="editor-desc-input"
              placeholder="Short description (optional)"
              rows="1"
            ></textarea>

            <!-- Formatting Toolbar -->
            <div class="editor-toolbar">
              <button class="editor-toolbar-btn" data-fmt="bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
              <button class="editor-toolbar-btn" data-fmt="italic" title="Italic (Ctrl+I)"><em>I</em></button>
              <button class="editor-toolbar-btn" data-fmt="underline" title="Underline"><u>U</u></button>
              <button class="editor-toolbar-btn" data-fmt="strike" title="Strikethrough"><s>S</s></button>
              <span class="editor-toolbar-sep"></span>
              <button class="editor-toolbar-btn" data-fmt="h1" title="Heading 1">H1</button>
              <button class="editor-toolbar-btn" data-fmt="h2" title="Heading 2">H2</button>
              <button class="editor-toolbar-btn" data-fmt="h3" title="Heading 3">H3</button>
              <span class="editor-toolbar-sep"></span>
              <button class="editor-toolbar-btn" data-fmt="bullet" title="Bullet List">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm3.75-1.5a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5Zm0 5a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5Zm0 5a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5ZM3 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm-1 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/></svg>
              </button>
              <button class="editor-toolbar-btn" data-fmt="number" title="Numbered List">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2.003 2.5a.5.5 0 0 0-.723-.447l-1.003.5a.5.5 0 0 0 .446.895l.28-.14V6H.5a.5.5 0 0 0 0 1h2.006a.5.5 0 1 0 0-1h-.503V2.5ZM5.75 2.5a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5Zm0 5a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5Zm0 5a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5ZM.924 10.32l.003-.004a.851.851 0 0 1 .144-.153A.66.66 0 0 1 1.5 10c.195 0 .306.068.374.146a.57.57 0 0 1 .128.376c0 .453-.269.682-.8 1.078l-.035.025C.692 11.973 0 12.495 0 13.5a.5.5 0 0 0 .5.5h2.003a.5.5 0 0 0 0-1H1.146c.132-.197.351-.372.654-.597l.047-.035c.47-.35 1.156-.858 1.156-1.845 0-.365-.118-.744-.377-1.038-.268-.303-.658-.485-1.126-.485-.48 0-.84.202-1.068.392a1.858 1.858 0 0 0-.348.384l-.007.011-.002.004-.001.002-.001.001a.5.5 0 0 0 .851.525Z"/></svg>
              </button>
              <button class="editor-toolbar-btn" data-fmt="task" title="Checklist">☑</button>
              <span class="editor-toolbar-sep"></span>
              <button class="editor-toolbar-btn" data-fmt="code" title="Inline Code (Ctrl+Shift+K)">&lt;&gt;</button>
              <button class="editor-toolbar-btn" data-fmt="codeblock" title="Code Block">{/}</button>
              <button class="editor-toolbar-btn" data-fmt="link" title="Link (Ctrl+K)">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z"/></svg>
              </button>
              <button class="editor-toolbar-btn" data-fmt="image" title="Upload Image">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M16 13.25A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25V2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75ZM1.75 2.5a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h.94l4.72-6.295a.75.75 0 0 1 1.18 0L12.31 13h1.94a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25ZM5.5 6a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/></svg>
              </button>
              <span class="editor-toolbar-sep"></span>
              <button class="editor-toolbar-btn" data-fmt="hr" title="Horizontal Rule">—</button>
            </div>

            <!-- Markdown Textarea -->
            <textarea
              id="editor-textarea"
              class="editor-textarea"
              placeholder="Start writing... (type / for commands)"
            ></textarea>

            <!-- Word Count -->
            <div class="editor-word-count" id="editor-word-count">0 words · 1 min read</div>

            <!-- Preview (hidden by default, shown in preview mode) -->
            <div class="editor-preview-content article-content essay-body" id="editor-preview-content"></div>
          </div>
        </div>

        <!-- Sidebar -->
        <div class="editor-sidebar-backdrop" id="editor-sidebar-backdrop"></div>
        <aside class="editor-sidebar" id="editor-sidebar">
          <!-- Document Settings -->
          <div class="editor-section">
            <div class="editor-section-header">
              <span class="editor-section-title">Document Settings</span>
              <svg class="editor-section-toggle" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M12.78 5.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 6.28a.749.749 0 1 1 1.06-1.06L8 8.939l3.72-3.719a.749.749 0 0 1 1.06 0Z"/></svg>
            </div>
            <div class="editor-section-body">
              <div class="editor-field">
                <label class="editor-label">Publish Date</label>
                <input type="date" id="editor-date" class="editor-input" />
              </div>
            </div>
          </div>

          <!-- Tags -->
          <div class="editor-section">
            <div class="editor-section-header">
              <span class="editor-section-title">Tags</span>
              <svg class="editor-section-toggle" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M12.78 5.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 6.28a.749.749 0 1 1 1.06-1.06L8 8.939l3.72-3.719a.749.749 0 0 1 1.06 0Z"/></svg>
            </div>
            <div class="editor-section-body">
              <div class="editor-tags-list" id="editor-tags-list"></div>
              <input
                type="text"
                id="editor-tags-input"
                class="editor-input"
                placeholder="Add tag and press Enter"
              />
            </div>
          </div>

          <!-- Cover Image -->
          <div class="editor-section">
            <div class="editor-section-header">
              <span class="editor-section-title">Cover Image</span>
              <svg class="editor-section-toggle" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M12.78 5.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 6.28a.749.749 0 1 1 1.06-1.06L8 8.939l3.72-3.719a.749.749 0 0 1 1.06 0Z"/></svg>
            </div>
            <div class="editor-section-body">
              <input
                type="text"
                id="editor-cover-url"
                class="editor-input"
                placeholder="/assets/blog/slug/cover.webp"
              />
              <div class="editor-cover-preview" id="editor-cover-preview">
                <span class="editor-cover-empty">No cover image</span>
              </div>
            </div>
          </div>

          <!-- Document Outline -->
          <div class="editor-section">
            <div class="editor-section-header">
              <span class="editor-section-title">Document Outline</span>
              <svg class="editor-section-toggle" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M12.78 5.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 6.28a.749.749 0 1 1 1.06-1.06L8 8.939l3.72-3.719a.749.749 0 0 1 1.06 0Z"/></svg>
            </div>
            <div class="editor-section-body">
              <div class="editor-outline-list" id="editor-outline-list">
                <span style="color: var(--text-muted); font-size: var(--fs-caption);">No headings yet</span>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <!-- Slash Command Menu (floating) -->
    <div class="slash-menu" id="slash-menu"></div>

    <!-- Hidden file input for image uploads -->
    <input type="file" id="editor-image-upload" accept="image/*" style="display: none" />

    <script type="module" src="/script/editor.js"></script>
  </body>
</html>
